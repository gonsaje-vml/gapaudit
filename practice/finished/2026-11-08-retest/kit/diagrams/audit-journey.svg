<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 0 960 362" role="img" aria-labelledby="title desc"><title id="title">From scope to a verified report</title><desc id="desc">Scope, collect, review, assess, verify. Static collection and reviewer judgments have different roles.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#d50023"/></marker></defs><g font-family="system-ui, sans-serif"><text x="24" y="38" font-size="15" fill="#d50023" font-weight="700">THE AUDIT JOURNEY</text><rect x="24" y="66" width="164" height="176" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="40" y="96" font-size="15" fill="#d50023" font-weight="700">01</text><text x="40" y="129" font-size="21" fill="#0d2264" font-weight="700">Scope</text><text x="40" y="166" font-size="15" fill="#253047" font-weight="400">Choose routes</text><text x="40" y="190" font-size="15" fill="#253047" font-weight="400">and expectations</text><path d="M192 152 L207 152" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="212" y="66" width="164" height="176" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="228" y="96" font-size="15" fill="#d50023" font-weight="700">02</text><text x="228" y="129" font-size="21" fill="#0d2264" font-weight="700">Collect</text><text x="228" y="166" font-size="15" fill="#253047" font-weight="400">Python records</text><text x="228" y="190" font-size="15" fill="#253047" font-weight="400">static observations</text><path d="M380 152 L395 152" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="400" y="66" width="164" height="176" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="416" y="96" font-size="15" fill="#d50023" font-weight="700">03</text><text x="416" y="129" font-size="21" fill="#0d2264" font-weight="700">Review</text><text x="416" y="166" font-size="15" fill="#253047" font-weight="400">Browser checks</text><text x="416" y="190" font-size="15" fill="#253047" font-weight="400">matched states</text><path d="M568 152 L583 152" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="588" y="66" width="164" height="176" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="604" y="96" font-size="15" fill="#d50023" font-weight="700">04</text><text x="604" y="129" font-size="21" fill="#0d2264" font-weight="700">Assess</text><text x="604" y="166" font-size="15" fill="#253047" font-weight="400">Record findings</text><text x="604" y="190" font-size="15" fill="#253047" font-weight="400">and readiness</text><path d="M756 152 L771 152" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="776" y="66" width="164" height="176" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="792" y="96" font-size="15" fill="#d50023" font-weight="700">05</text><text x="792" y="129" font-size="21" fill="#0d2264" font-weight="700">Verify PDF</text><text x="792" y="166" font-size="15" fill="#253047" font-weight="400">Build, render</text><text x="792" y="190" font-size="15" fill="#253047" font-weight="400">inspect each page</text><rect x="24" y="268" width="916" height="72" rx="8" fill="#e9eefc" stroke="#dce1e9"/><text x="44" y="297" font-size="18" fill="#0d2264" font-weight="600">Automation supplies observations. A reviewer supplies supported judgments.</text><text x="44" y="323" font-size="16" fill="#536077" font-weight="400">A missing check stays Unverified; it does not become a pass.</text></g></svg>