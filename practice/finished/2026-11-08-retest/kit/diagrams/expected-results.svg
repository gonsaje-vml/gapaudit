<svg xmlns="http://www.w3.org/2000/svg" width="960" height="426" viewBox="0 0 960 426" role="img" aria-labelledby="title desc"><title id="title">Expected practice measurements</title><desc id="desc">Four comparable pairs, two pages linking to one missing download, one planted content regression. All page bars use four pages as denominator.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#d50023"/></marker></defs><g font-family="system-ui, sans-serif"><text x="24" y="38" font-size="15" fill="#d50023" font-weight="700">EXPECTED STATIC BASELINE</text><text x="24" y="67" font-size="17" fill="#536077" font-weight="400">Fictional fixtures · four inventoried pages · before browser review</text><text x="24" y="126" font-size="18" fill="#0d2264" font-weight="600">Comparable page pairs</text><rect x="394" y="102" width="460" height="30" rx="8" fill="#edf0f5" stroke="#edf0f5"/><rect x="394" y="102" width="460" height="30" rx="8" fill="#24745a" stroke="#24745a"/><text x="875" y="126" font-size="20" fill="#0d2264" font-weight="700">4 / 4</text><text x="24" y="201" font-size="18" fill="#0d2264" font-weight="600">Pages linking to missing file</text><rect x="394" y="177" width="460" height="30" rx="8" fill="#edf0f5" stroke="#edf0f5"/><rect x="394" y="177" width="230" height="30" rx="8" fill="#d50023" stroke="#d50023"/><text x="875" y="201" font-size="20" fill="#0d2264" font-weight="700">2 / 4</text><text x="24" y="276" font-size="18" fill="#0d2264" font-weight="600">Pages with content regression</text><rect x="394" y="252" width="460" height="30" rx="8" fill="#edf0f5" stroke="#edf0f5"/><rect x="394" y="252" width="115" height="30" rx="8" fill="#965b00" stroke="#965b00"/><text x="875" y="276" font-size="20" fill="#0d2264" font-weight="700">1 / 4</text><rect x="24" y="320" width="912" height="83" rx="8" fill="#fff7e5" stroke="#dce1e9"/><text x="44" y="352" font-size="21" fill="#0d2264" font-weight="700">1 distinct unavailable URL is linked from 2 pages.</text><text x="44" y="380" font-size="17" fill="#536077" font-weight="400">Count the URL once. Count each affected page once. These are different units.</text></g></svg>