<svg xmlns="http://www.w3.org/2000/svg" width="960" height="458" viewBox="0 0 960 458" role="img" aria-labelledby="title desc"><title id="title">Audit file dependencies</title><desc id="desc">Inputs feed captured records and measured baseline. Browser review supports findings and readiness. Preserved inputs support verified outputs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#d50023"/></marker></defs><g font-family="system-ui, sans-serif"><text x="24" y="38" font-size="15" fill="#d50023" font-weight="700">FOLLOW THE EVIDENCE</text><rect x="24" y="72" width="230" height="112" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="40" y="101" font-size="14" fill="#0d2264" font-weight="700">INPUTS</text><text x="40" y="132" font-size="15" fill="#253047" font-weight="400">config.json + urls.txt</text><text x="40" y="155" font-size="15" fill="#253047" font-weight="400">scope and route mapping</text><rect x="350" y="72" width="260" height="112" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="366" y="101" font-size="14" fill="#0d2264" font-weight="700">CAPTURED RECORDS</text><text x="366" y="132" font-size="15" fill="#253047" font-weight="400">evidence.json</text><text x="366" y="155" font-size="15" fill="#253047" font-weight="400">snapshots/ (raw originals)</text><rect x="700" y="72" width="236" height="112" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="716" y="101" font-size="14" fill="#0d2264" font-weight="700">MEASURED BASELINE</text><text x="716" y="132" font-size="15" fill="#253047" font-weight="400">analysis.json</text><text x="716" y="155" font-size="15" fill="#253047" font-weight="400">report.md</text><rect x="24" y="260" width="230" height="130" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="40" y="289" font-size="14" fill="#0d2264" font-weight="700">BROWSER REVIEW</text><text x="40" y="320" font-size="15" fill="#253047" font-weight="400">screenshots + checks</text><text x="40" y="343" font-size="15" fill="#253047" font-weight="400">browser-review.json</text><text x="40" y="366" font-size="15" fill="#253047" font-weight="400">reviews.json (findings)</text><rect x="350" y="260" width="260" height="130" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="366" y="289" font-size="14" fill="#0d2264" font-weight="700">READINESS ASSESSMENT</text><text x="366" y="320" font-size="15" fill="#253047" font-weight="400">readiness.json</text><text x="366" y="343" font-size="15" fill="#253047" font-weight="400">pages, types, variants, uses</text><text x="366" y="366" font-size="15" fill="#253047" font-weight="400">work and acceptance tests</text><rect x="700" y="260" width="236" height="130" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="716" y="289" font-size="14" fill="#0d2264" font-weight="700">VERIFIED OUTPUT</text><text x="716" y="320" font-size="15" fill="#253047" font-weight="400">readiness-audit.pdf</text><text x="716" y="343" font-size="15" fill="#253047" font-weight="400">*.build.json</text><text x="716" y="366" font-size="15" fill="#253047" font-weight="400">pdf-qa/ page images</text><path d="M264 128 L338 128" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M620 128 L688 128" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480 192 L480 246" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M264 322 L338 322" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M620 322 L688 322" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="270" y="112" font-size="14" fill="#536077" font-weight="400">collect</text><text x="626" y="112" font-size="14" fill="#536077" font-weight="400">render</text><text x="492" y="224" font-size="14" fill="#536077" font-weight="400">preserve lineage</text><text x="25" y="434" font-size="17" fill="#0d2264" font-weight="600">Evidence + reviews → recalculated measurements. B