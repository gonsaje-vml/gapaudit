<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Block types, variants and uses</title><desc id="desc">Illustration only: one hero type, two variants and three uses. These overlapping units are not additive.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#d50023"/></marker></defs><g font-family="system-ui, sans-serif"><text x="24" y="38" font-size="15" fill="#d50023" font-weight="700">COUNTING UNITS — ILLUSTRATION ONLY</text><rect x="24" y="72" width="214" height="208" rx="8" fill="#e9eefc" stroke="#dce1e9"/><text x="44" y="110" font-size="24" fill="#0d2264" font-weight="700">1 block type</text><text x="44" y="151" font-size="24" fill="#0d2264" font-weight="400">Hero</text><text x="44" y="197" font-size="17" fill="#253047" font-weight="400">The reusable</text><text x="44" y="222" font-size="17" fill="#253047" font-weight="400">kind of content.</text><rect x="336" y="72" width="258" height="86" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="356" y="107" font-size="20" fill="#0d2264" font-weight="700">Variant: standard</text><text x="356" y="136" font-size="16" fill="#253047" font-weight="400">Two authored placements</text><rect x="336" y="194" width="258" height="86" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="356" y="229" font-size="20" fill="#0d2264" font-weight="700">Variant: video</text><text x="356" y="258" font-size="16" fill="#253047" font-weight="400">One authored placement</text><path d="M246 175 L322 115" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M246 175 L322 236" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="702" y="80" width="234" height="46" rx="8" fill="#edf7f2" stroke="#dce1e9"/><text x="718" y="109" font-size="17" fill="#24745a" font-weight="600">Page A · standard</text><rect x="702" y="144" width="234" height="46" rx="8" fill="#edf7f2" stroke="#dce1e9"/><text x="718" y="173" font-size="17" fill="#24745a" font-weight="600">Page B · standard</text><rect x="702" y="208" width="234" height="46" rx="8" fill="#edf7f2" stroke="#dce1e9"/><text x="718" y="237" font-size="17" fill="#24745a" font-weight="600">Page C · video</text><path d="M603 112 L688 112" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M603 137 L688 175" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M603 237 L688 237" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="318" width="912" height="78" rx="8" fill="#0d2264" stroke="#0d2264"/><text x="44" y="351" font-size="25" fill="#fff" font-weight="700">1 type  ·  2 variants  ·  3 uses</text><text x="44" y="379" font-size="17" fill="#fff" font-weight="400">These overlap. Do not add them or make them slices of one readiness chart.</text></g></svg>