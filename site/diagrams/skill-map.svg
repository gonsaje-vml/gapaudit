<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">One skill and its supporting files</title><desc id="desc">SKILL.md coordinates protocol, schemas, review starters and execution tools. A reviewer still supplies real observations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#d50023"/></marker></defs><g font-family="system-ui, sans-serif"><text x="24" y="38" font-size="15" fill="#d50023" font-weight="700">INSIDE PDF-GAP-AUDIT</text><rect x="24" y="64" width="912" height="76" rx="8" fill="#0d2264" stroke="#0d2264"/><text x="44" y="96" font-size="23" fill="#fff" font-weight="700">SKILL.md — the workflow coordinator</text><text x="44" y="122" font-size="17" fill="#fff" font-weight="400">Fresh audit · reassessment · frozen reproduction · retest</text><rect x="24" y="176" width="288" height="160" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="40" y="207" font-size="15" fill="#0d2264" font-weight="700">RULES &amp; CONTRACTS</text><text x="40" y="239" font-size="15" fill="#253047" font-weight="400">review-protocol.md</text><text x="40" y="268" font-size="15" fill="#253047" font-weight="400">browser-review-schema.md</text><text x="40" y="297" font-size="15" fill="#253047" font-weight="400">readiness-report-schema.md</text><rect x="336" y="176" width="288" height="160" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="352" y="207" font-size="15" fill="#0d2264" font-weight="700">REVIEW STARTERS</text><text x="352" y="239" font-size="15" fill="#253047" font-weight="400">audit-checklist.md</text><text x="352" y="268" font-size="15" fill="#253047" font-weight="400">browser-review.example.json</text><text x="352" y="297" font-size="15" fill="#253047" font-weight="400">Actual browser observations</text><rect x="648" y="176" width="288" height="160" rx="8" fill="#f1f4fa" stroke="#dce1e9"/><text x="664" y="207" font-size="15" fill="#0d2264" font-weight="700">EXECUTABLE TOOLS</text><text x="664" y="239" font-size="15" fill="#253047" font-weight="400">gap_audit.py (collector)</text><text x="664" y="268" font-size="15" fill="#253047" font-weight="400">build_readiness_pdf.py</text><text x="664" y="297" font-size="15" fill="#253047" font-weight="400">verify_pdf.py</text><path d="M480 145 L480 165" stroke="#d50023" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="366" width="912" height="72" rx="8" fill="#fff7e5" stroke="#dce1e9"/><text x="44" y="395" font-size="16" fill="#253047" font-weight="500">requirements.txt pins the PDF packages. build_pdf.py retains legacy report reproduction.</text><text x="44" y="421" font-size="16" fill="#536077" font-weight="400">The skill guides an agent; it does not provide a browser or invent completed checks.</text></g></svg>